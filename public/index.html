<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura YouTube to MP3 Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Kantumruy Pro', 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        }
        .glow-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <!-- Main Container -->
    <div class="max-w-xl w-full glass-card rounded-3xl p-8 sm:p-10 space-y-8 relative overflow-hidden">

        <!-- Decorative Background Glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Title -->
        <div class="text-center space-y-3 relative z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/30 mb-2">
                <i class="fa-solid fa-music text-2xl"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                YouTube to MP3
            </h1>
            <p class="text-slate-400 text-sm max-w-sm mx-auto">
                បម្លែង និងទាញយកវីដេអូពី YouTube ទៅជាឯកសារអូឌីយ៉ូ MP3 យ៉ាងលឿន និងមានគុណភាពខ្ពស់។
            </p>
        </div>

        <!-- Converter Form -->
        <div class="space-y-5 relative z-10">
            <div class="space-y-2">
                <label for="youtubeUrl" class="block text-xs font-semibold uppercase tracking-wider text-indigo-400">
                    <i class="fa-solid fa-link mr-1.5"></i> បញ្ចូលលីង YouTube របស់អ្នក
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-brands fa-youtube text-lg"></i>
                    </span>
                    <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..."
                        autocomplete="off"
                        class="w-full bg-slate-900/90 border border-slate-700/80 text-white text-sm rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition font-sans">
                </div>
            </div>

            <button id="convertBtn" type="button" class="glow-btn w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 text-white font-bold py-4 rounded-2xl transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>ចាប់ផ្ដើមបម្លែងជា MP3 (Convert)</span>
            </button>
        </div>

        <!-- Progress Section -->
        <div id="progressSection" class="hidden space-y-3 pt-2 relative z-10 animate-fade-in text-center">
            <div class="inline-block animate-spin text-indigo-400 text-2xl mb-1">
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <p id="statusMessage" class="text-xs font-medium text-indigo-300 animate-pulse">កំពុងតភ្ជាប់ទៅកាន់ Server...</p>
            <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden border border-slate-700/50">
                <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-full animate-pulse"></div>
            </div>
        </div>

        <!-- Download Result Section -->
        <div id="downloadResult" class="hidden p-5 bg-gradient-to-r from-emerald-950/60 to-slate-900/80 border border-emerald-500/30 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 relative z-10 animate-fade-in shadow-xl">
            <div class="text-left space-y-1 w-full sm:w-auto">
                <p class="text-sm font-bold text-emerald-400 flex items-center">
                    <i class="fa-solid fa-circle-check mr-2 text-lg"></i> បម្លែងជោគជ័យ!
                </p>
                <p id="resultFileName" class="text-xs text-slate-300 font-mono truncate max-w-[260px]"></p>
            </div>
            <a id="downloadLink" class="glow-btn w-full sm:w-auto px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-semibold transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-600/30">
                <i class="fa-solid fa-download"></i>
                <span>ទាញយក MP3 (Download)</span>
            </a>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="hidden p-4 rounded-2xl text-xs text-rose-300 bg-rose-500/10 border border-rose-500/30 relative z-10 animate-fade-in flex items-center space-x-3">
            <i class="fa-solid fa-triangle-exclamation text-base shrink-0"></i>
            <span id="alertText"></span>
        </div>

        <!-- Footer Info -->
        <div class="text-center pt-2 border-t border-slate-800/80 text-xs text-slate-500">
            ប្រព័ន្ធទាញយកលឿន និងសុវត្ថិភាពខ្ពស់ដោយ Aura Media Engine
        </div>

    </div>

    <!-- Frontend Script -->
    <script>
        const BACKEND_URL = '/api/download';
        const REQUEST_TIMEOUT_MS = 12 * 60 * 1000;

        const urlField = document.getElementById('youtubeUrl');
        const alertBox = document.getElementById('alertBox');
        const alertText = document.getElementById('alertText');
        const progressSec = document.getElementById('progressSection');
        const statusMsg = document.getElementById('statusMessage');
        const downloadRes = document.getElementById('downloadResult');
        const downloadLink = document.getElementById('downloadLink');
        const convertBtn = document.getElementById('convertBtn');

        let currentBlobUrl = null;

        function showError(message) {
            alertText.innerText = message;
            alertBox.classList.remove('hidden');
        }

        function isYouTubeUrl(value) {
            try {
                const host = new URL(value).hostname.toLowerCase();
                return ['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtu.be'].includes(host);
            } catch {
                return false;
            }
        }

        async function convertYouTubeToMp3() {
            const urlInput = urlField.value.trim();

            // Reset UI
            alertBox.classList.add('hidden');
            downloadRes.classList.add('hidden');

            if (!urlInput) {
                showError('សូមបញ្ចូលលីង YouTube ជាមុនសិន!');
                return;
            }
            if (!isYouTubeUrl(urlInput)) {
                showError('សូមបញ្ចូលលីង YouTube ឱ្យបានត្រឹមត្រូវ!');
                return;
            }

            // Release the previous file from memory
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }

            // Disable button & show progress
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50', 'cursor-not-allowed');
            progressSec.classList.remove('hidden');
            statusMsg.innerText = 'កំពុងតភ្ជាប់ទៅកាន់ Server ដើម្បីបម្លែងជា MP3...';

            // Free Render servers go to sleep, so the first request can be slow
            const slowTimer = setTimeout(() => {
                statusMsg.innerText = 'Server កំពុងភ្ញាក់ពីដេក ឬកំពុងបម្លែង... សូមរង់ចាំបន្តិច (អាចចំណាយពេល ១ នាទី)';
            }, 8000);

            const controller = new AbortController();
            const abortTimer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput }),
                    signal: controller.signal
                });

                if (!response.ok) {
                    let message = 'មិនអាចទាញយកវីដេអូនេះបានទេ';
                    try {
                        const errData = await response.json();
                        if (errData && errData.error) message = errData.error;
                    } catch (_) { /* response was not JSON */ }
                    throw new Error(message);
                }

                statusMsg.innerText = 'កំពុងរៀបចំឯកសារ MP3...';
                const blob = await response.blob();
                currentBlobUrl = URL.createObjectURL(blob);
                const fileName = `youtube_audio_${Date.now()}.mp3`;

                // Show download link
                progressSec.classList.add('hidden');
                downloadRes.classList.remove('hidden');
                document.getElementById('resultFileName').innerText = fileName;
                downloadLink.href = currentBlobUrl;
                downloadLink.download = fileName;

            } catch (err) {
                progressSec.classList.add('hidden');
                if (err.name === 'AbortError') {
                    showError('មានបញ្ហា៖ ចំណាយពេលយូរពេក។ សូមព្យាយាមម្តងទៀត។');
                } else if (err instanceof TypeError) {
                    showError('មានបញ្ហា៖ មិនអាចតភ្ជាប់ទៅ Server បានទេ។ សូមពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត។');
                } else {
                    showError('មានបញ្ហា៖ ' + err.message);
                }
            } finally {
                clearTimeout(slowTimer);
                clearTimeout(abortTimer);
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        convertBtn.addEventListener('click', convertYouTubeToMp3);
        urlField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !convertBtn.disabled) convertYouTubeToMp3();
        });
    </script>
</body>
</html>
